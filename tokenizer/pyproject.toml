[project]
name = "tokenizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "groknut", email = "groknut.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
tokenizer = "tokenizer:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ['.']
